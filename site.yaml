    eventos:
      - { fecha: "14 de noviembre", hora: "19:00", titulo: "Presentación de «La hora del levante»", lugar: "Librería del Pasaje, Cádiz", texto: "Lectura de un capítulo, charla con el público y firma de ejemplares.", url: "/#contacto" }
      - { fecha: "28 de noviembre", hora: "18:30", titulo: Club de lectura de la biblioteca, lugar: "Biblioteca del barrio de Santa María, Cádiz", texto: "Hablamos de «Sal en los bolsillos» con el club de los jueves.", url: "" }
      - { fecha: "13 de enero", hora: "10:00", titulo: "Taller «Tu primer capítulo»", lugar: "En línea, por videollamada", texto: "Ocho sesiones, una por semana, con lecturas y correcciones en grupo.", url: "/#contacto" }
      - { fecha: "7 de febrero", hora: "12:00", titulo: Encuentro con lectores jóvenes, lugar: "Instituto de la Caleta, Cádiz", texto: "Charla sobre cómo nace una historia, para alumnos de bachillerato.", url: "" }
    cta: { texto: Invitarme a tu ciudad, url: "/#contacto" }

  newsletter:
    activa: true
    antetitulo: La carta del mes
    titulo: Una carta al mes, sin ruido.
    texto: "El primer domingo de cada mes te escribo una carta corta: en qué estoy trabajando, un libro que me ha gustado y las fechas nuevas antes que nadie."
    items:
      - { titulo: Lo que estoy escribiendo }
      - { titulo: Un libro recomendado }
      - { titulo: Talleres y fechas antes que nadie }
