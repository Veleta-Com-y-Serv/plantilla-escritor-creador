    titulo: Lo que he publicado
    texto: "Tres libros para adultos y uno para leer en voz alta. Están en las librerías y en la web de cada editorial; si quieres uno dedicado, escríbeme."
    obras:
      - { titulo: La hora del levante, texto: "Agosto en Cádiz. Una mujer vuelve a la casa de su abuela en el barrio de la Viña para venderla y se queda atrapada tres días por el levante, con una caja de cartas que nadie le había enseñado.", anio: "2025", editorial: Ediciones Bajamar, categoria: Novela, estado: Novedad, imagen: /fotos/obra-levante.jpg, url: "https://www.candelasoria.es/la-hora-del-levante", destacado: true }
      - { titulo: Sal en los bolsillos, texto: "Doce relatos breves de gente que vive del mar o a su lado: mariscadores, una profesora de natación, un faro sin farero.", anio: "2022", editorial: Libros del Muelle, categoria: Relatos, estado: "", imagen: /fotos/obra-sal.jpg, url: "https://www.candelasoria.es/sal-en-los-bolsillos", destacado: false }
      - { titulo: El faro de los gatos, texto: "Un cuento ilustrado para leer en voz alta sobre un gato que tiene miedo a la oscuridad y vive en un faro.", anio: "2023", editorial: Ediciones Bajamar, categoria: Infantil, estado: "", imagen: /fotos/obra-faro.jpg, url: "", destacado: false }
      - { titulo: Azoteas, texto: "Crónicas de las azoteas de Cádiz: tendederos, vecinas, macetas y conversaciones que solo se tienen allí arriba.", anio: "2020", editorial: Libros del Muelle, categoria: Crónica, estado: Agotado, imagen: /fotos/obra-azoteas.jpg, url: "", destacado: false }
    cta: { texto: Pedir un ejemplar dedicado, url: "/#contacto" }

  fragmento:
    activa: true
    antetitulo: Un fragmento
    declaracion: "En Cádiz el levante no sopla: empuja. Te despeina las certezas, te cierra las ventanas que dejaste abiertas y, cuando por fin se va, la ciudad entera huele a algo que acaba de empezar."
    autor: "De «La hora del levante» (2025)"
    imagen: /fotos/fragmento.jpg
    cta: { texto: Recibir el primer capítulo, url: "/#newsletter" }

  sobre:
    activa: true
    antetitulo: Sobre mí
    titulo: Soy Candela. Escribo de madrugada y hablo de libros por la tarde.
    declaracion: "Escribo para entender lo que no sé decir en voz alta."
    texto: |
      Nací en Cádiz, estudié Filología en Sevilla y pasé diez años corrigiendo textos ajenos antes de atreverme con los míos. Mi primer libro salió de una libreta que llevaba siempre en el bolso.

      Escribo sobre lo que tengo cerca: el mar, los barrios, la gente que se queda cuando todos se van. Me interesan las historias pequeñas que, contadas despacio, se vuelven enormes.

      Desde 2021 grabo «Levante en la azotea», un pódcast sobre el oficio de escribir, y doy talleres en grupos pequeños para quien quiere empezar o terminar su primer libro.
    imagen: /fotos/estudio.jpg
    items:
      - { titulo: Cuatro libros publicados, texto: "Novela, relatos, crónica y un cuento infantil.", icono: libro }
      - { titulo: Un pódcast cada miércoles, texto: "Conversaciones sobre escribir, leer y publicar.", icono: microfono }
      - { titulo: Talleres de escritura, texto: "Presenciales en Cádiz y en línea, en grupos de ocho.", icono: pluma }
    galeria:
      - /fotos/azotea.jpg
      - /fotos/cuadernos.jpg
      - /fotos/taller.jpg
    cta: { texto: Escríbeme, url: "/#contacto" }

  episodios:
    activa: true
    antetitulo: El pódcast
    titulo: Levante en la azotea
    texto: "Cada miércoles, una conversación sin prisa sobre el oficio de escribir: cómo empezar, cómo seguir y cómo terminar. Con autoras, libreros, editoras y lectores."
    imagen: /fotos/podcast.jpg
    episodios:
      - { numero: "48", titulo: "Escribir con calor: rutinas para el verano", texto: "Cómo sostener un proyecto largo cuando el cuerpo pide playa y siesta.", duracion: "42 min", fecha: "22 oct 2026", url: "https://www.youtube.com/" }
      - { numero: "47", titulo: "La librera que lo lee todo", texto: "Con una librera de barrio que recomienda libros a sus vecinos desde hace treinta años.", duracion: "55 min", fecha: "15 oct 2026", url: "https://www.youtube.com/" }
      - { numero: "46", titulo: "El primer capítulo, otra vez", texto: "Por qué casi todos reescribimos el comienzo cinco veces y qué hacer para no quedarse ahí.", duracion: "38 min", fecha: "8 oct 2026", url: "https://www.youtube.com/" }
      - { numero: "45", titulo: "Cartas a una editora", texto: "Qué buscan las editoriales pequeñas y cómo preparar un manuscrito para enviarlo.", duracion: "47 min", fecha: "1 oct 2026", url: "https://www.youtube.com/" }
    cta: { texto: Todos los episodios, url: "https://www.youtube.com/" }

