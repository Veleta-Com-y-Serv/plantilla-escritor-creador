  prensa:
    activa: true
    antetitulo: Prensa y lectores
    titulo: Lo que se dice de los libros
    testimonios:
      - { texto: "Una novela que se lee con el pelo revuelto. Soria escribe el levante como si fuera un personaje más, y es el mejor de todos.", autor: Revista Mar de Fondo, nota: "Sobre «La hora del levante»" }
      - { texto: "Relatos breves, exactos y muy gaditanos, sin caer nunca en la postal.", autor: Suplemento Letras del Sur, nota: "Sobre «Sal en los bolsillos»" }
      - { texto: "Lo leí en dos tardes en la playa y ya lo he regalado tres veces.", autor: "Pilar M., lectora", nota: "Sobre «La hora del levante»" }
      - { texto: "Es el pódcast que pongo cuando me cuesta sentarme a escribir. Siempre salgo con una idea.", autor: "Andrés R., oyente", nota: "Sobre «Levante en la azotea»" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de escribirme
    preguntas:
      - { pregunta: "¿Puedo conseguir un ejemplar dedicado?", respuesta: "Sí. Escríbeme y te digo en qué librerías de Cádiz quedan ejemplares firmados o te lo dedico y te lo envío por correo." }
      - { pregunta: "¿Vas a colegios, bibliotecas o clubes de lectura?", respuesta: "Sí, me encanta. Cuéntame la fecha, el lugar y con qué grupo sería, y lo vemos. También hago encuentros por videollamada." }
      - { pregunta: "¿Cómo son los talleres de escritura?", respuesta: "Grupos de ocho personas, ocho semanas y una sesión semanal de dos horas, en Cádiz o en línea. Escribimos, leemos en voz alta y corregimos juntos." }
      - { pregunta: "¿Puedo proponer un invitado para el pódcast?", respuesta: "Claro. Mándame su nombre, a qué se dedica y por qué crees que tendría algo que contar sobre el oficio de escribir." }
      - { pregunta: "¿Lees manuscritos?", respuesta: "No puedo leer manuscritos sueltos, pero en los talleres trabajamos con los textos de cada persona y te doy una lectura detallada." }

  contacto:
    activa: true
